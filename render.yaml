services:
  - type: web
    name: ocr-dashboard
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: OCR_UPLOAD_DIR
        value: /app/storage/uploads
      - key: OCR_OUTPUT_DIR
        value: /app/storage/outputs
      - key: OCR_DB_PATH
        value: /app/storage/ocr.db
